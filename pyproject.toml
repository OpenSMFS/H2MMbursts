[build-system]
requires = [
    "setuptools>=77", 
    "setuptools_scm>=8.0",
    "numpy>=1.19",
]
build-backend = "setuptools.build_meta"

[project]
name = "H2MMbursts"
dynamic = ["version", ]
authors = [
    {name="Paul David Harris", email="harripd@gmail.com"}]
description = "photon-by-photon Hidden Markov Modeling extension for smfBursts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt", ]
keywords = ["single-molecule FRET","smFRET", "H2MM", "biophysics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering"
 ]

requires-python = ">= 3.10"
dependencies = [
    "numpy>=1.19",
    "pandas>=2.0",
    "smfbursts",
]

[project.urls]
Homepage = "https://github.com/OpenSMFS/H2MMbursts"
Documentation = "https://h2mmbursts.readthedocs.io/en/latest/"
Issues = "https://github.com/harripd/H2MMbursts/issues"
Repository = "https://github.com/OpenSMFS/H2MMbursts"

[project.optional-dependencies]
scientific = ["jupyter", "matplotlib>=3.0.1", "numba"]
gui = ["matplotlib>=3.0.1", ]

[tool.setuptools.packages.find]
include = ['H2MMbursts*']

[tool.setuptools_scm]
