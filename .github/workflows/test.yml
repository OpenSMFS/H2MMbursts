name: Tests

on: [push, pull_request]

jobs:
  Download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          python-version: "3.12"
          activate-environment: test
      - name: Install Pooch
        shell: bash -l {0}
        run: conda install -c conda-forge pooch
      - name: Download Files
        shell: bash -l {0}
        run: |
          cd tests
          python fetch_files.py
      - uses: actions/cache@v6
        id: filecache
        with:
          path: ./docs/source/notebooks/data
          enableCrossOsArchive: true
          key: testfiles

  TestProject:
    needs: Download
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore Cached Files
        id: cache-action
        uses: actions/cache/restore@v6
        with:
          path: ./docs/source/notebooks/data
          key: testfiles
          enableCrossOsArchive: true
      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge
          python-version: ${{ matrix.python-version }}
          activate_environment: test
      - name: Apple Silicon Oddities
        if: matrix.os == 'macos-latest'
        shell: bash -l {0}
        run: |
          brew install c-blosc hdf5
          export HDF5_DIF=/opt/homebrew/opt/hdf5
          export BLOSC_DIR=/opt/homebrew/opt/c-blosc
      - name: Install Dependencies
        shell: bash -l {0}
        run: |
          conda install -c conda-forge pip
          python -m pip install setuptools build
          conda install -c conda-forge pytest numpy numba scipy pandas matplotlib pytables msgpack-python phconvert H2MM_C
          python -m pip install pyFCS smfbursts
      - name: Install Project
        shell: bash -l {0}
        run:
          pip install .
      - name: Test Project
        shell: bash -l {0}
        run: |
          cd tests
          pytest
